<!doctype html>  
<html>  
<head>  
  <meta charset="UTF-8">  
  <title>Register</title>  
  <script src="./public/js/config.js"></script>  
  <style>  
    * { box-sizing: border-box; margin: 0; padding: 0; }  
    body {  
      font-family: monospace;  
      font-size: 12px;  
      max-width: 400px;  
      margin: 50px auto;  
      padding: 20px;  
    }  
    h2 { margin-bottom: 20px; }  
    input {  
      width: 100%;  
      padding: 8px;  
      margin: 10px 0;  
      border: 1px solid #000;  
      font-family: monospace;  
      font-size: 12px;  
    }  
    button {  
      width: 100%;  
      padding: 10px;  
      margin: 10px 0;  
      cursor: pointer;  
      border: 1px solid #000;  
      background: #fff;  
      font-family: monospace;  
      font-size: 12px;  
    }  
    button:hover { background: #f0f0f0; }  
    .hint {  
      font-size: 10px;  
      margin: -8px 0 10px 0;  
      color: #666;  
    }  
    .error {  
      border: 1px solid #000;  
      padding: 10px;  
      margin: 10px 0;  
      background: #f9f9f9;  
    }  
    .success {  
      border: 1px solid #000;  
      padding: 10px;  
      margin: 10px 0;  
    }  
    a {  
      color: #000;  
      text-decoration: underline;  
    }  
  </style>  
</head>  
<body>  
  <h2>Register</h2>  
  <form id="registerForm">  
    <input type="text" id="username" placeholder="Username" required>  
    <div class="hint">Min 3 chars, alphanumeric + underscore only</div>  
    
    <input type="password" id="password" placeholder="Password" required>  
    <div class="hint">Min 8 chars</div>  
    
    <button type="submit">Register</button>  
  </form>  
  
  <div id="message"></div>  
  
  <div style="margin-top: 20px; text-align: center;">  
    <a href="login.html">Already have an account? Login</a>  
  </div>  

  <script>  
    async function graphql(query, variables) {  
      const response = await fetch(`${API_CONFIG.BASE_URL}/graphql`, {  
        method: 'POST',  
        credentials: 'include',  
        headers: { 'Content-Type': 'application/json' },  
        body: JSON.stringify({ query, variables })  
      });  
      return await response.json();  
    }  

    document.getElementById('registerForm').addEventListener('submit', async (e) => {  
      e.preventDefault();  
      
      const username = document.getElementById('username').value.trim();  
      const password = document.getElementById('password').value;  
      const messageDiv = document.getElementById('message');  
      
      // Client-side validation  
      if (username.length < 3) {  
        messageDiv.innerHTML = '<div class="error">Username must be at least 3 characters</div>';  
        return;  
      }  
      
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {  
        messageDiv.innerHTML = '<div class="error">Username can only contain letters, numbers, and underscores</div>';  
        return;  
      }  
      
      if (password.length < 8) {  
        messageDiv.innerHTML = '<div class="error">Password must be at least 8 characters</div>';  
        return;  
      }  
      
      const query = `  
        mutation Register($username: String!, $password: String!) {  
          register(username: $username, password: $password) {  
            success  
            message  
            user { id username }  
          }  
        }  
      `;  
      
      try {  
        const { data, errors } = await graphql(query, { username, password });  
        
        if (errors) {  
          messageDiv.innerHTML = `<div class="error">Error: ${errors[0].message}</div>`;  
          return;  
        }  
        
        if (data.register.success) {  
          messageDiv.innerHTML = `<div class="success">${data.register.message}</div>`;  
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);  
        } else {  
          messageDiv.innerHTML = `<div class="error">${data.register.message}</div>`;  
        }  
      } catch (err) {  
        messageDiv.innerHTML = '<div class="error">Network error</div>';  
      }  
    });  
  </script>  
</body>  
</html>
