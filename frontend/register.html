<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <script src="./public/js/config.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        background: #f0f2f5;
        color: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .register-container {
        background: #fff;
        border-radius: 8px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px;
        width: 100%;
        max-width: 400px;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        color: #050505;
        margin-bottom: 24px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 16px;
      }

      input {
        display: block;
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 20px;
        background: #f0f2f5;
        font-size: 14px;
        font-family: inherit;
        color: #050505;
        outline: none;
        transition: background 0.2s ease;
      }

      input:focus {
        background: #e4e6eb;
      }

      input::placeholder {
        color: #65676b;
      }

      .hint {
        font-size: 12px;
        color: #65676b;
        margin-top: 6px;
        margin-left: 16px;
        line-height: 1.4;
      }

      button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 20px;
        background: #0084ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-top: 8px;
      }

      button:hover {
        background: #0073e6;
      }

      button:active {
        background: #0062cc;
      }

      button:disabled {
        background: #e4e6eb;
        color: #bcc0c4;
        cursor: not-allowed;
      }

      #message {
        margin-top: 16px;
      }

      .error {
        background: #fff0f1;
        color: #f02849;
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 3px solid #f02849;
        font-size: 13px;
        line-height: 1.4;
      }

      .success {
        background: #e7f8ec;
        color: #31a24c;
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 3px solid #31a24c;
        font-size: 13px;
        line-height: 1.4;
      }

      .footer-links {
        margin-top: 24px;
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #e4e6eb;
      }

      .footer-links a {
        color: #0084ff;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s ease;
      }

      .footer-links a:hover {
        color: #0073e6;
        text-decoration: underline;
      }

      .form-header {
        text-align: center;
        margin-bottom: 24px;
      }

      .form-subtitle {
        font-size: 13px;
        color: #65676b;
        margin-top: 8px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="form-header">
        <h2>Register</h2>
        <div class="form-subtitle">Create a new account to get started</div>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <input type="text" id="username" placeholder="Username" required />
          <div class="hint">Min 3 chars, alphanumeric + underscore only</div>
        </div>

        <div class="form-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <div class="hint">Min 8 chars</div>
        </div>

        <button type="submit">Register</button>
      </form>

      <div id="message"></div>

      <div class="footer-links">
        <a href="login.html">Already have an account? Login</a>
      </div>
    </div>

    <script>
      async function graphql(query, variables) {
        const response = await fetch(`${API_CONFIG.BASE_URL}/graphql`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables }),
        });
        return await response.json();
      }

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;
          const messageDiv = document.getElementById("message");

          if (username.length < 3) {
            messageDiv.innerHTML =
              '<div class="error">Username must be at least 3 characters</div>';
            return;
          }

          if (!/^[a-zA-Z0-9_]+$/.test(username)) {
            messageDiv.innerHTML =
              '<div class="error">Username can only contain letters, numbers, and underscores</div>';
            return;
          }

          if (password.length < 8) {
            messageDiv.innerHTML =
              '<div class="error">Password must be at least 8 characters</div>';
            return;
          }

          const query = `  
        mutation Register($username: String!, $password: String!) {  
          register(username: $username, password: $password) {  
            success  
            message  
            user { id username }  
          }  
        }  
      `;

          try {
            const { data, errors } = await graphql(query, {
              username,
              password,
            });

            if (errors) {
              messageDiv.innerHTML = `<div class="error">Error: ${errors[0].message}</div>`;
              return;
            }

            if (data.register.success) {
              messageDiv.innerHTML = `<div class="success">${data.register.message}</div>`;
              setTimeout(() => {
                window.location.href = "login.html";
              }, 1500);
            } else {
              messageDiv.innerHTML = `<div class="error">${data.register.message}</div>`;
            }
          } catch (err) {
            messageDiv.innerHTML =
              '<div class="error">Network error. Please try again.</div>';
          }
        });
    </script>
  </body>
</html>
