<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat Interface</title>
    <script src="./public/js/config.js"></script>
    <link rel="stylesheet" href="./public/css/indexcss.css" />
  </head>
  <body>
    <div id="friendsPanel">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 20px 16px 12px 16px;
        "
      >
        <h3
          style="
            margin: 0;
            padding: 0;
            font-size: 24px;
            font-weight: 700;
            color: #050505;
          "
        >
          Chats
        </h3>
        <div style="display: flex; gap: 8px">
          <button
            class="header-btn"
            id="userInfoBtn"
            title="User Info"
            style="width: 36px; height: 36px; font-size: 16px"
          >
            ℹ️
          </button>
          <a href="friend.html" style="text-decoration: none">
            <button
              class="header-btn"
              id="friendManagementBtn"
              title="Friend Management"
              style="width: 36px; height: 36px; font-size: 16px"
            >
              👥
            </button>
          </a>
        </div>
      </div>

      <div id="searchBar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search conversations..."
        />
      </div>
      <div id="friendsList"></div>
    </div>
    <div id="chatPanel">
      <div id="chatHeader">
        <div id="chatHeaderLeft">
          <div>
            <div id="chatTitle">Select a conversation</div>
            <div id="onlineStatus"></div>
          </div>
        </div>
        <div id="chatHeaderButtons">
          <button class="header-btn" id="callBtn" title="Voice Call" disabled>
            📞
          </button>
          <button
            class="header-btn"
            id="videoCallBtn"
            title="Video Call"
            disabled
          >
            📹
          </button>
          <button
            class="header-btn"
            id="screenShareBtn"
            title="Screen Share"
            disabled
          >
            🖥️
          </button>
        </div>
      </div>
      <div id="messagesContainer">
        <div id="loadingIndicator">
          <div class="spinner"></div>
          <span>Loading messages...</span>
        </div>
        <div id="messagesList">
          <div class="empty-state">
            <div class="empty-state-icon"></div>
            <div>Select a conversation to start messaging</div>
          </div>
        </div>
      </div>
      <div id="typingIndicator"></div>
      <div id="inputArea">
        <div id="replyingTo">
          <button id="cancelReplyBtn">✕</button>
          <span id="replyText"></span>
        </div>
        <div id="inputRow">
          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            disabled
          />
          <button id="sendBtn" disabled>➤</button>
        </div>
      </div>
    </div>
    <div id="modalOverlay"></div>
    <div id="forwardModal">
      <h3>Forward Message</h3>
      <div id="forwardList"></div>
      <button class="modal-close-btn" onclick="closeForwardModal()">
        Cancel
      </button>
    </div>

    <div
      id="userInfoModal"
      style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border-radius: 12px;
        padding: 24px;
        z-index: 1000;
        min-width: 320px;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      "
    >
      <h3 style="margin-bottom: 16px; font-size: 20px; color: #050505">
        Your User Information
      </h3>
      <div
        style="
          background: #f0f2f5;
          padding: 16px;
          border-radius: 8px;
          margin-bottom: 16px;
        "
      >
        <div style="font-size: 13px; color: #65676b; margin-bottom: 4px">
          User ID
        </div>
        <div
          id="userIdDisplay"
          style="
            font-size: 16px;
            font-weight: 600;
            color: #050505;
            font-family: monospace;
            word-break: break-all;
          "
        ></div>
      </div>
      <button class="modal-close-btn" id="userInfoClose">
        Close
      </button>
    </div>

    <div id="incomingCallOverlay" class="call-overlay">
      <div class="incoming-call-card">
        <div class="incoming-call-avatar"></div>
        <div id="incomingCallerName">Unknown</div>
        <div id="incomingCallType">Voice Call</div>
        <div class="incoming-call-buttons">
          <button id="answerCallBtn" class="call-action-btn accept">
            <span>📞</span>
            <span>Answer</span>
          </button>
          <button id="rejectCallBtn" class="call-action-btn reject">
            <span>✕</span>
            <span>Decline</span>
          </button>
        </div>
      </div>
    </div>
    <div id="activeCallOverlay" class="call-overlay">
      <div class="call-window">
        <div class="call-header">
          <div class="call-status-info">
            <div id="activeCallUsername">Call Active</div>
            <div id="activeCallStatus">Connecting...</div>
          </div>
          <button id="minimizeCallBtn" class="call-header-btn" title="Minimize">
            −
          </button>
        </div>
        <div id="callVideoContainer" class="call-video-container">
          <video
            id="remoteVideo"
            autoplay
            playsinline
            class="remote-video"
          ></video>
          <video
            id="localVideo"
            autoplay
            muted
            playsinline
            class="local-video"
          ></video>
        </div>
        <div class="call-controls">
          <button id="toggleMuteBtn" class="call-control-btn">
            <span id="muteIcon">🎤</span>
          </button>
          <button
            id="toggleVideoBtn"
            class="call-control-btn"
            style="display: none"
          >
            <span id="videoIcon">📹</span>
          </button>
          <button id="endCallBtn" class="call-control-btn end-call">
            <span>📵</span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./public/js/indexjs.js"></script>
  </body>
</html>
