<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="./public/js/config.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        background: #f0f2f5;
        color: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-container {
        background: #fff;
        border-radius: 8px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.05),
          0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px;
        width: 100%;
        max-width: 400px;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        color: #050505;
        margin-bottom: 24px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 16px;
      }

      input {
        display: block;
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 20px;
        background: #f0f2f5;
        font-size: 14px;
        font-family: inherit;
        color: #050505;
        outline: none;
        transition: background 0.2s ease;
      }

      input:focus {
        background: #e4e6eb;
      }

      input::placeholder {
        color: #65676b;
      }

      button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 20px;
        background: #0084ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s ease;
        margin-top: 8px;
      }

      button:hover {
        background: #0073e6;
      }

      button:active {
        background: #0062cc;
      }

      button:disabled {
        background: #e4e6eb;
        color: #bcc0c4;
        cursor: not-allowed;
      }

      .footer-links {
        margin-top: 24px;
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #e4e6eb;
      }

      .footer-links a {
        color: #0084ff;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s ease;
      }

      .footer-links a:hover {
        color: #0073e6;
        text-decoration: underline;
      }

      .error-message {
        background: #fff0f1;
        color: #f02849;
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 3px solid #f02849;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }

      .error-message.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login</h2>

      <div id="errorMessage" class="error-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <input type="text" id="username" placeholder="Username" required />
        </div>

        <div class="form-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit">Login</button>
      </form>

      <div class="footer-links">
        <a href="register.html">Don't have an account? Register</a>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const errorDiv = document.getElementById("errorMessage");

          errorDiv.classList.remove("show");

          const query = `  
        mutation Login($username: String!, $password: String!) {  
          login(username: $username, password: $password) {  
            success  
            message  
            user { id username }  
          }  
        }  
      `;

          try {
            const response = await fetch(`${API_CONFIG.BASE_URL}/graphql`, {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                query,
                variables: { username, password },
              }),
            });

            const { data, errors } = await response.json();

            if (errors) {
              errorDiv.textContent = "Error: " + errors[0].message;
              errorDiv.classList.add("show");
              return;
            }

            if (data.login.success) {
              window.location.href = "/";
            } else {
              errorDiv.textContent = data.login.message;
              errorDiv.classList.add("show");
            }
          } catch (err) {
            errorDiv.textContent = "Network error. Please try again.";
            errorDiv.classList.add("show");
          }
        });
    </script>
  </body>
</html>
